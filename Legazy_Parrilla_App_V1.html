<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080808">
<title>Legazy Parrilla</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif}
.app{max-width:440px;margin:auto;min-height:100vh;background:#101010;padding-bottom:88px}
header{height:78px;padding:10px 16px;display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:9;background:#101010f2;border-bottom:1px solid #252525}
.logo{width:54px;height:54px;border-radius:50%;border:2px solid #f5b400;object-fit:cover}
.brand{font-size:17px;font-weight:900;letter-spacing:1px;flex:1} .sub{font-size:10px;color:#aaa;letter-spacing:2px}
.cart{border:0;background:#f5b400;border-radius:14px;padding:11px 12px;font-weight:900;font-size:16px}
.page{padding:16px} .hero{border:1px solid #604500;border-radius:24px;padding:24px 20px;background:radial-gradient(circle at 80% 20%,#392700,#161616 55%,#111);overflow:hidden}
.hero h1{font-size:30px;line-height:1.05;margin:0 0 9px} .hero p{color:#d7d7d7;line-height:1.45;margin:0 0 18px}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:900;font-size:14px} .gold{background:#f5b400;color:#111}
.outline{background:transparent;color:#f5b400;border:1px solid #f5b400;margin-left:6px}
.section-title{font-size:21px;margin:22px 0 12px} .cats{display:flex;gap:8px;overflow:auto;padding-bottom:4px}
.cat{white-space:nowrap;border:1px solid #333;background:#181818;color:#ddd;border-radius:20px;padding:9px 13px;font-weight:700}
.cat.active{background:#f5b400;color:#111;border-color:#f5b400}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:#191919;border:1px solid #2b2b2b;border-radius:18px;padding:13px}
.pic{height:100px;border-radius:14px;background:linear-gradient(145deg,#332100,#151515);display:flex;align-items:center;justify-content:center;font-size:45px}
.product h3{font-size:16px;margin:10px 0 5px} .desc{font-size:12px;color:#aaa;min-height:30px} .price{color:#f5b400;font-weight:900;margin:8px 0 10px}
.add{width:100%;padding:11px;border:0;border-radius:11px;background:#262626;color:#f5b400;font-weight:900}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#151515;border-top:1px solid #333;display:flex;justify-content:space-around;padding:9px 3px 12px;z-index:20}
.bottom button{background:none;border:0;color:#999;font-size:11px;font-weight:800} .bottom button.active{color:#f5b400}
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:30} .sheet{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#181818;border-radius:24px 24px 0 0;padding:20px;max-height:82vh;overflow:auto}
.sheet h2{margin:0 0 14px} .row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #2d2d2d} .row .grow{flex:1} .total{display:flex;justify-content:space-between;font-size:19px;font-weight:900;padding:18px 0} .empty{color:#aaa;text-align:center;padding:30px 0}
.toast{display:none;position:fixed;bottom:94px;left:50%;transform:translateX(-50%);background:#f5b400;color:#111;padding:12px 16px;border-radius:12px;font-weight:900;z-index:50;white-space:nowrap}
</style>
</head>

<h2>🛒 Tu pedido</h2><div id="cartItems"></div>
<div class="total"><span>Total</span><span id="total">RD$0</span></div>
<button class="btn gold" style="width:100%" onclick="checkout()">Enviar pedido por WhatsApp</button>
<br><button class="btn outline" style="width:100%;margin:10px 0 0" onclick="hideCart()">Seguir comprando</button>
</div></div>
<div class="toast" id="toast"></div>
</div>

<script>
const items=[
{id:1,name:'Churrasco Legazy',cat:'carnes',price:650,emoji:'🥩',desc:'Corte a la parrilla al punto.'},
{id:2,name:'Costillas al Barril',cat:'barril',price:650,emoji:'🍖',desc:'Cocción lenta, jugosas y ahumadas.'},
{id:3,name:'Bandeja Familiar',cat:'bandejas',price:1500,emoji:'🧺',desc:'Perfecta para compartir en familia.'},
{id:4,name:'Bandeja para Compartir',cat:'bandejas',price:1800,emoji:'🍗',desc:'Una experiencia completa Legazy.'},
{id:5,name:'Plátano Asado',cat:'acompanantes',price:200,emoji:'🍌',desc:'Dorado a la parrilla.'},
{id:6,name:'Piña Asada',cat:'acompanantes',price:250,emoji:'🍍',desc:'Jugosa, dulce y asada.'},
{id:7,name:'Batata Asada',cat:'acompanantes',price:200,emoji:'🍠',desc:'Asada lentamente.'},
{id:8,name:'Moro de Guandules',cat:'acompanantes',price:250,emoji:'🍚',desc:'El acompañante clásico.'}
];
let cart={};
function money(n){return 'RD$'+n.toLocaleString('es-DO')}
function render(cat='todos'){let p=items.filter(x=>cat==='todos'||x.cat===cat);document.getElementById('products').innerHTML=p.map(x=>`<article class="product"><div class="pic">${x.emoji}</div><h3>${x.name}</h3><div class="desc">${x.desc}</div><div class="price">${money(x.price)}</div><button class="add" onclick="add(${x.id})">+ Agregar</button></article>`).join('')}
function add(id){cart[id]=(cart[id]||0)+1;update();toast('Agregado al pedido 🔥')}
function update(){let count=Object.values(cart).reduce((a,b)=>a+b,0);document.getElementById('cartCount').textContent=count}
function filter(cat,el){document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));el.classList.add('active');render(cat)}
function scrollMenu(){document.getElementById('menuTitle').scrollIntoView({behavior:'smooth'})}
function openCart(){let keys=Object.keys(cart);document.getElementById('cartItems').innerHTML=keys.length?keys.map(k=>{let x=items.find(i=>i.id==k),q=cart[k];return `<div class="row"><div class="grow"><b>${x.name}</b><br><span style="color:#aaa">${q} × ${money(x.price)}</span></div><b>${money(x.price*q)}</b></div>`}).join(''):'<div class="empty">Tu pedido está vacío 🔥<br>Agrega algo del menú.</div>';let t=keys.reduce((s,k)=>s+items.find(i=>i.id==k).price*cart[k],0);document.getElementById('total').textContent=money(t);document.getElementById('overlay').style.display='block'}
function hideCart(){document.getElementById('overlay').style.display='none'} function closeCart(e){if(e.target.id==='overlay')hideCart()}
function checkout(){if(!Object.keys(cart).length)return toast('Agrega productos primero');let text='Hola, Legazy Parrilla. Quiero hacer este pedido:%0A';Object.keys(cart).forEach(k=>{let x=items.find(i=>i.id==k);text+=`%0A${cart[k]}x ${x.name} - ${money(x.price*cart[k])}`});window.open('https://wa.me/18097593293?text='+text,'_blank')}
function showPromos(){document.getElementById('content').innerHTML='<section class="hero"><h1>🔥 Promos Legazy</h1><p>Combos para compartir y ofertas especiales. Aquí podremos publicar tus promociones del día.</p><button class="btn gold" onclick="home()">Volver al inicio</button></section><h2 class="section-title">Próximamente</h2><div class="product" style="margin:0"><div class="pic">🧺🔥</div><h3>Combo Legazy para compartir</h3><div class="desc">Espacio listo para colocar precio, carnes y acompañantes.</div></div>'}
function contact(){document.getElementById('content').innerHTML='<section class="hero"><h1>📲 Contacta a Legazy</h1><p>WhatsApp: 809-759-3293<br>Instagram: @legazyparrilla1</p><button class="btn gold" onclick="window.open(\'https://wa.me/18097593293\',\'_blank\')">WhatsApp</button><button class="btn outline" onclick="window.open(\'https://instagram.com/legazyparrilla1\',\'_blank\')">Instagram</button></section>'}
function home(){location.reload()} function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1500)}
render();
</script>
</body>
</html>
